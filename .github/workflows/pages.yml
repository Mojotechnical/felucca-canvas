# Felucca Canvas: build the three firmwares and publish the site (the list, the screenshots, an installer each) on
# GitHub Pages. Repo Settings > Pages > Source: "GitHub Actions". Runs on every push to main, or "Run workflow".
name: Build and publish installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest      # Linux x86-64: JieLi's toolchain runs natively
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install Pillow fonttools
      - name: JieLi toolchain and SDK
        run: |
          tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
      - name: Build Canvas 16+FX
        run: FELUCCA_CANVAS_KEYS=0 ./build.sh --release 1.8-c16
      - name: Build Canvas 27
        run: FELUCCA_CANVAS_KEYS=1 ./build.sh --release 1.8-c27
      - name: Build Canvas 8+CTL
        run: FELUCCA_CANVAS_KEYS=2 ./build.sh --release 1.8-c8
      - name: Make the site
        run: >
          python3 tools/make_canvas_site.py _site
          16fx=build/felucca-1.8-c16.fwsc 27=build/felucca-1.8-c27.fwsc 8ctl=build/felucca-1.8-c8.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: felucca-canvas-firmwares
          path: build/felucca-1.8-c*.fwsc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
